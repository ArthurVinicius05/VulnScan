services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_KEY: ${VULNSCAN_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./vulnscan.db}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TLS_SERVER_NAME: ${SMTP_TLS_SERVER_NAME:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_ARCHIVE_FILES: ${MAX_ARCHIVE_FILES:-3000}
      MAX_EXTRACTED_MB: ${MAX_EXTRACTED_MB:-100}
      MAX_QUEUED_STORAGE_MB: ${MAX_QUEUED_STORAGE_MB:-50}
      ANALYSIS_JOB_RETENTION_DAYS: ${ANALYSIS_JOB_RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      SCANNER_WORKER_URL: http://scanner-worker:8001
      SCANNER_WORKER_TIMEOUT_SECONDS: 30
      SCANNER_WORKER_TOKEN: ${SCANNER_WORKER_TOKEN:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      ENABLE_OSV_SCAN: ${ENABLE_OSV_SCAN:-false}
      OSV_WORKER_URL: http://osv-worker:8002
      ENABLE_WEBSITE_SCAN: ${ENABLE_WEBSITE_SCAN:-false}
      WEBSITE_WORKER_URL: http://website-worker:8003
      WEBSITE_WORKER_TIMEOUT_SECONDS: 20
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      redis:
        condition: service_healthy
      scanner-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - default
      - scanner_internal
      - osv_internal
      - website_internal
      - redis_internal

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - redis_internal

  scanner-worker:
    build: ./backend
    command: uvicorn app.worker:app --host 0.0.0.0 --port 8001
    environment:
      APP_ENV: ${APP_ENV:-development}
      SCANNER_WORKER_TOKEN: ${SCANNER_WORKER_TOKEN:-}
    user: "10001:10001"
    expose:
      - "8001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - scanner_internal

  website-worker:
    profiles: ["website-scan"]
    build:
      context: ./backend
      dockerfile: Dockerfile.website
    environment:
      APP_ENV: production
    user: "10002:10002"
    expose:
      - "8003"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 32
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - website_internal
      - website_egress

  osv-worker:
    profiles: ["osv-online"]
    build:
      context: ./backend
      dockerfile: Dockerfile.osv
    environment:
      APP_ENV: production
    user: "10001:10001"
    expose:
      - "8002"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - osv_internal
      - osv_egress

  analysis-worker:
    build: ./backend
    command: ["python", "-m", "app.jobs.runner"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./vulnscan.db}
      REDIS_URL: redis://redis:6379/0
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_ARCHIVE_FILES: ${MAX_ARCHIVE_FILES:-3000}
      MAX_EXTRACTED_MB: ${MAX_EXTRACTED_MB:-100}
      SCANNER_WORKER_URL: http://scanner-worker:8001
      SCANNER_WORKER_TIMEOUT_SECONDS: 30
      ANALYSIS_JOB_RETENTION_DAYS: ${ANALYSIS_JOB_RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      SCANNER_WORKER_TOKEN: ${SCANNER_WORKER_TOKEN:-}
      ENABLE_OSV_SCAN: ${ENABLE_OSV_SCAN:-false}
      ENABLE_WEBSITE_SCAN: ${ENABLE_WEBSITE_SCAN:-false}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      scanner-worker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - scanner_internal
      - osv_internal
      - website_internal
      - redis_internal

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000

networks:
  scanner_internal:
    internal: true
  osv_internal:
    internal: true
  osv_egress:
  website_internal:
    internal: true
  website_egress:
  redis_internal:
    internal: true
