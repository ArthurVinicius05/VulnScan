services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173
      SCANNER_WORKER_URL: http://scanner-worker:8001
      SCANNER_WORKER_TIMEOUT_SECONDS: 30
      ENABLE_OSV_SCAN: ${ENABLE_OSV_SCAN:-false}
      OSV_WORKER_URL: http://osv-worker:8002
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      scanner-worker:
        condition: service_healthy
    networks:
      - default
      - scanner_internal
      - osv_internal

  scanner-worker:
    build: ./backend
    command: uvicorn app.worker:app --host 0.0.0.0 --port 8001
    environment:
      APP_ENV: production
    user: "10001:10001"
    expose:
      - "8001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - scanner_internal

  osv-worker:
    profiles: ["osv-online"]
    build:
      context: ./backend
      dockerfile: Dockerfile.osv
    environment:
      APP_ENV: production
    user: "10001:10001"
    expose:
      - "8002"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - osv_internal
      - osv_egress

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000

networks:
  scanner_internal:
    internal: true
  osv_internal:
    internal: true
  osv_egress:
