name: Container build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python for lockfile generation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate hashed Python lockfile
        run: |
          python -m pip install --upgrade "pip==25.3" "pip-tools==7.5.2"
          pip-compile --generate-hashes --resolver=backtracking --output-file backend/requirements.lock backend/requirements.txt
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build isolated scanner image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: vulnscan-backend:ci
      - name: Build opt-in website worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.website
          push: false
          load: true
          tags: vulnscan-website-worker:ci
      - name: Build opt-in OSV worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.osv
          push: false
          load: true
          tags: vulnscan-osv-worker:ci

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
