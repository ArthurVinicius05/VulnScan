name: CI

on:
  pull_request:
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Generate hashed Python lockfile
        run: |
          python -m pip install --upgrade "pip==25.3" "pip-tools==7.5.2"
          pip-compile --generate-hashes --resolver=backtracking --output-file backend/requirements.lock backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Generate npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfiles are committed and current
        run: |
          git ls-files --error-unmatch backend/requirements.lock frontend/package-lock.json
          git diff --exit-code -- backend/requirements.lock frontend/package-lock.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vulnscan-dependency-lockfiles
          path: |
            backend/requirements.lock
            frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7

  image-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Verify pinned image digests against registry
        run: python scripts/check_image_digests.py --verify-registry
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vulnscan-image-digests
          path: images.lock
          retention-days: 7

  secret-scan:
    needs: dependency-locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Scan repository for leaked secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 detect --source=/repo --config=/repo/.gitleaks.toml --no-git --redact --verbose --exit-code 1

  backend:
    needs: dependency-locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: vulnscan-dependency-lockfiles
          path: .
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked backend dependencies
        run: python -m pip install --upgrade pip==25.3 && pip install --require-hashes -r backend/requirements.lock
      - name: Validate maintenance scripts
        run: bash -n scripts/backup_postgres.sh scripts/restore_postgres.sh scripts/test_postgres_backup_restore.sh
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Ruff static checks
        run: ruff check --select E4,E7,E9,F backend/app backend/tests
      - name: Bandit security checks
        run: bandit -q -r backend/app -ll
      - name: Python dependency vulnerability audit
        run: |
          python -m pip install "pip-audit==2.9.0"
          pip-audit -r backend/requirements.lock

  frontend:
    needs: dependency-locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: vulnscan-dependency-lockfiles
          path: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  production-images:
    needs: dependency-locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: vulnscan-dependency-lockfiles
          path: .
      - name: Build backend image
        run: docker build -t vulnscan-backend:ci ./backend
      - name: Build production frontend image
        run: docker build -f frontend/Dockerfile.production -t vulnscan-frontend:ci ./frontend
      - name: Build restricted SMTP proxy image
        run: docker build -f backend/Dockerfile.smtp-proxy -t vulnscan-smtp-proxy:ci ./backend
      - name: Build isolated website worker image
        run: docker build -f backend/Dockerfile.website -t vulnscan-website-worker:ci ./backend
      - name: Build isolated OSV worker image
        run: docker build -f backend/Dockerfile.osv -t vulnscan-osv-worker:ci ./backend
      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgresql+psycopg://vulnscan:ci-only-password@db:5432/vulnscan
          CORS_ORIGINS: '["https://vulnscan.example.test"]'
          FRONTEND_URL: https://vulnscan.example.test
          SCANNER_WORKER_TOKEN: ci-only-worker-token
          OPS_ADMIN_TOKEN: ci-only-ops-admin-token-for-compose-validation
          DEAD_LETTER_ARCHIVE_RETENTION_HOURS: "72"
          MFA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          SMTP_UPSTREAM_HOST: smtp.example.test
          SMTP_TLS_SERVER_NAME: smtp.example.test
        run: docker compose -f docker-compose.production.yml config --quiet

  postgres-integration:
    needs: dependency-locks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_DB: vulnscan_test
          POSTGRES_USER: vulnscan
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulnscan -d vulnscan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: vulnscan-dependency-lockfiles
          path: .
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked backend dependencies
        run: python -m pip install --upgrade pip && pip install --require-hashes -r backend/requirements.lock
      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          VULNSCAN_TEST_DATABASE_URL: postgresql+psycopg://vulnscan:ci-only-password@localhost:5432/vulnscan_test
        run: python -m pytest -q tests/test_postgres_integration.py
      - name: Install encrypted backup smoke-test tools
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Test encrypted PostgreSQL backup and restore
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: vulnscan
          PGPASSWORD: ci-only-password
          PGDATABASE: vulnscan_test
          PG_CLIENT_IMAGE: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        run: bash scripts/test_postgres_backup_restore.sh
