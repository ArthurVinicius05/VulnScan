name: CI

on:
  pull_request:
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  production-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t vulnscan-backend:ci ./backend
      - name: Build production frontend image
        run: docker build -f frontend/Dockerfile.production -t vulnscan-frontend:ci ./frontend
      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgresql+psycopg://vulnscan:ci-only-password@db:5432/vulnscan
          CORS_ORIGINS: '["https://vulnscan.example.test"]'
          FRONTEND_URL: https://vulnscan.example.test
        run: docker compose -f docker-compose.production.yml config --quiet
